name: Build OnceWorld LSPatched APKS

run-name: OnceWorld LSPatch ${{ inputs.expectedVersionName }} ${{ inputs.nonce }}

on:
  workflow_dispatch:
    inputs:
      packageName:
        description: Server-resolved Android package
        required: true
      architecture:
        description: Server-resolved ABI
        required: true
      versionCode:
        description: APKPure fallback version code when already resolved
        required: true
      versionName:
        description: APKPure fallback version name when already resolved
        required: true
      expectedVersionName:
        description: Server-resolved preferred release name
        required: true
      metadataSource:
        description: Source used to resolve the preferred release metadata
        required: true
      moduleSha:
        description: Precompiled OWKit module commit
        required: true
      moduleRef:
        description: OWKit source branch
        required: false
        default: main
      moduleAsset:
        description: Precompiled OWKit release asset
        required: true
      nonce:
        description: Request nonce from Vercel
        required: true

permissions:
  contents: write

concurrency:
  group: onceworld-${{ inputs.nonce }}
  cancel-in-progress: false

env:
  LSPATCH_VERSION: v1.2-487
  LSPATCH_JAR_URL: https://github.com/JingMatrix/LSPatch/releases/download/v1.2/lspatch-v1.2-487-release.jar
  LSPATCH_JAR_SHA256: d238fdc414d121b7fa454d8b4ccf420df3a8c97d563761861ff92bd9c5da2165

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout builder
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.12'

      - name: Set up Android signing tools
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: "platform-tools build-tools;35.0.0"

      - name: Prepare workspace and precompiled module
        env:
          MODULE_SHA: ${{ inputs.moduleSha }}
          MODULE_ASSET: ${{ inputs.moduleAsset }}
          MODULE_REPO: ${{ secrets.ONCEWORLD_MODULE_REPO }}
          GH_TOKEN: ${{ secrets.AE_MODULE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$MODULE_REPO"
          test -n "$GH_TOKEN"
          [[ "$MODULE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MODULE_ASSET" =~ ^[A-Za-z0-9._-]+\.apk$ ]]

          WORK="$RUNNER_TEMP/onceworld-lspatch"
          mkdir -p "$WORK"/{tools,module,xapk,lspatch-out,bundle,signed-splits}
          gh release download "module-${MODULE_SHA}" \
            --repo "$MODULE_REPO" \
            --pattern "$MODULE_ASSET" \
            --dir "$WORK/module"
          MODULE_APK="$WORK/module/$MODULE_ASSET"
          test -s "$MODULE_APK"

          echo "WORK=$WORK" >> "$GITHUB_ENV"
          echo "MODULE_APK=$MODULE_APK" >> "$GITHUB_ENV"
          echo "MODULE_SHA_SHORT=${MODULE_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Cache LSPatch
        id: cache-lspatch
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/onceworld-lspatch/tools/lspatch.jar
          key: onceworld-lspatch-${{ env.LSPATCH_VERSION }}

      - name: Download LSPatch
        if: steps.cache-lspatch.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error \
            --connect-timeout 20 --max-time 120 \
            -o "$WORK/tools/lspatch.jar" "$LSPATCH_JAR_URL"

      - name: Fetch, patch, verify, and package
        env:
          PACKAGE_NAME: ${{ inputs.packageName }}
          ARCHITECTURE: ${{ inputs.architecture }}
          FALLBACK_VERSION_CODE: ${{ inputs.versionCode }}
          FALLBACK_VERSION_NAME: ${{ inputs.versionName }}
          EXPECTED_VERSION_NAME: ${{ inputs.expectedVersionName }}
          METADATA_SOURCE: ${{ inputs.metadataSource }}
          GPLAYDL_API_KEY: ${{ secrets.GPLAYDL_API_KEY }}
          NONCE: ${{ inputs.nonce }}
          EXPECTED_SOURCE_CERT: ${{ vars.ONCEWORLD_SOURCE_CERT_SHA256 }}
          EXPECTED_MODULE_CERT: ${{ vars.ONCEWORLD_MODULE_CERT_SHA256 }}
          EXPECTED_HOST_CERT: ${{ vars.ONCEWORLD_HOST_CERT_SHA256 }}
        run: |
          set -Eeuo pipefail
          trap 'status=$?; echo "Failed at workflow script line $LINENO: $BASH_COMMAND (exit $status)" >&2; exit $status' ERR
          [[ "$PACKAGE_NAME" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$ARCHITECTURE" == 'arm64-v8a' ]]
          [[ "$FALLBACK_VERSION_CODE" =~ ^[0-9]+$ ]]
          [[ "$METADATA_SOURCE" == 'google-play' || "$METADATA_SOURCE" == 'apkpure' ]]
          [[ "$NONCE" =~ ^[A-Za-z0-9._-]+$ ]]

          LSPATCH_JAR="$WORK/tools/lspatch.jar"
          test -s "$LSPATCH_JAR"
          [ "$(sha256sum "$LSPATCH_JAR" | awk '{print $1}')" = "$LSPATCH_JAR_SHA256" ]
          unzip -tq "$LSPATCH_JAR" >/dev/null

          # Google Play is the primary source. The sourced helper contacts APKPure
          # only when Play authentication, delivery, or validation fails, then
          # normalizes either result into the existing xapk/manifest.json contract.
          source scripts/fetch-onceworld-source.sh

          MANIFEST="$WORK/xapk/manifest.json"
          test -s "$MANIFEST"
          jq -e --arg package "$PACKAGE_NAME" --arg code "$VERSION_CODE" \
            '.package_name == $package and (.version_code | tostring) == $code' "$MANIFEST" >/dev/null

          EXPECTED_SPLIT="config.${ARCHITECTURE//-/_}"
          jq -e --arg split "$EXPECTED_SPLIT" \
            'any(.split_apks[]; .id == $split)' "$MANIFEST" >/dev/null

          BASE_NAME=$(jq -r '.split_apks[] | select(.id == "base") | .file' "$MANIFEST")
          [[ "$BASE_NAME" =~ ^[A-Za-z0-9._-]+\.apk$ ]]
          BASE_APK="$WORK/xapk/$BASE_NAME"
          test -s "$BASE_APK"

          mapfile -t SPLIT_NAMES < <(jq -r '.split_apks[] | select(.id != "base") | .file' "$MANIFEST")
          [ "${#SPLIT_NAMES[@]}" -gt 0 ]
          for split_name in "${SPLIT_NAMES[@]}"; do
            [[ "$split_name" =~ ^[A-Za-z0-9._-]+\.apk$ ]]
            test -s "$WORK/xapk/$split_name"
          done

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          ZIPALIGN="$SDK_ROOT/build-tools/35.0.0/zipalign"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          test -n "$EXPECTED_SOURCE_CERT"
          EXPECTED_SOURCE_CERT=$(printf '%s' "$EXPECTED_SOURCE_CERT" \
            | tr -d ':' | tr '[:upper:]' '[:lower:]')
          SOURCE_CERT=''
          SOURCE_APKS=("$BASE_APK")
          for split_name in "${SPLIT_NAMES[@]}"; do
            SOURCE_APKS+=("$WORK/xapk/$split_name")
          done
          for source_apk in "${SOURCE_APKS[@]}"; do
            SOURCE_CERT_OUTPUT="$WORK/$(basename "$source_apk").source-certificates.txt"
            "$APKSIGNER" verify --print-certs "$source_apk" > "$SOURCE_CERT_OUTPUT"
            CERT=$(awk -F': ' \
              '/certificate SHA-256 digest:/ && !digest {digest=$NF} END {print digest}' \
              "$SOURCE_CERT_OUTPUT" | tr -d ':' | tr '[:upper:]' '[:lower:]')
            test -n "$CERT"
            if [ -z "$SOURCE_CERT" ]; then
              SOURCE_CERT=$CERT
            fi
            [ "$CERT" = "$SOURCE_CERT" ]
          done
          [ "$SOURCE_CERT" = "$EXPECTED_SOURCE_CERT" ]

          # OnceWorld uses the same single modern module in Vector and LSPatch.
          # Reject classic XposedBridge artifacts so the two delivery paths cannot diverge again.
          MODULE_ENTRIES=$(unzip -Z1 "$MODULE_APK")
          grep -Fxq 'META-INF/xposed/java_init.list' <<< "$MODULE_ENTRIES"
          grep -Fxq 'META-INF/xposed/module.prop' <<< "$MODULE_ENTRIES"
          grep -Fxq 'META-INF/xposed/scope.list' <<< "$MODULE_ENTRIES"
          ! grep -Fxq 'assets/xposed_init' <<< "$MODULE_ENTRIES"
          MODULE_PROP=$(unzip -p "$MODULE_APK" META-INF/xposed/module.prop)
          grep -Fxq 'minApiVersion=102' <<< "$MODULE_PROP"
          grep -Fxq 'targetApiVersion=102' <<< "$MODULE_PROP"
          JAVA_ENTRY_COUNT=$(unzip -p "$MODULE_APK" META-INF/xposed/java_init.list \
            | awk 'NF && $1 !~ /^#/ { count++ } END { print count + 0 }')
          [ "$JAVA_ENTRY_COUNT" -eq 1 ]
          JAVA_ENTRY=$(unzip -p "$MODULE_APK" META-INF/xposed/java_init.list \
            | awk 'NF && $1 !~ /^#/ { print; exit }' | tr -d '\r')
          [ "$JAVA_ENTRY" = 'com.owkit.core.ModuleEntry' ]
          unzip -p "$MODULE_APK" classes.dex > "$WORK/module-classes.dex"
          ! LC_ALL=C grep -aEq 'de[/\.]robv[/\.]android[/\.]xposed|LSPatchEntry' \
            "$WORK/module-classes.dex"
          MODULE_ID=$(awk -F= '$1 == "id" { print $2; exit }' <<< "$MODULE_PROP")
          [[ "$MODULE_ID" =~ ^[A-Za-z0-9._-]+$ ]]
          test -n "$(unzip -Z1 "$MODULE_APK" | grep '^lib/arm64-v8a/.*\.so$')"
          ! unzip -Z1 "$MODULE_APK" | grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/'
          test -n "$EXPECTED_MODULE_CERT"
          MODULE_CERT_OUTPUT="$WORK/module-certificates.txt"
          "$APKSIGNER" verify --print-certs "$MODULE_APK" > "$MODULE_CERT_OUTPUT"
          MODULE_CERT=$(awk -F': ' \
            '/certificate SHA-256 digest:/ && !digest {digest=$NF} END {print digest}' \
            "$MODULE_CERT_OUTPUT" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          EXPECTED_MODULE_CERT=$(printf '%s' "$EXPECTED_MODULE_CERT" \
            | tr -d ':' | tr '[:upper:]' '[:lower:]')
          [ "$MODULE_CERT" = "$EXPECTED_MODULE_CERT" ]

          # OnceWorld deliberately uses LSPatch's default host key, not AE's Ashfur key. Extract
          # it from the integrity-pinned release so local and hosted OnceWorld builds retain the
          # same update-compatible identity without committing another keystore here.
          PATCH_KEY="$WORK/lspatch-default.jks"
          unzip -p "$LSPATCH_JAR" assets/keystore > "$PATCH_KEY"
          test -s "$PATCH_KEY"
          keytool -list -keystore "$PATCH_KEY" -storepass 123456 -alias key0 >/dev/null

          java -jar "$LSPATCH_JAR" "$BASE_APK" \
            -m "$MODULE_APK" \
            -o "$WORK/lspatch-out" \
            -l 2 \
            -k "$PATCH_KEY" 123456 key0 123456 \
            -f

          mapfile -t PATCHED < <(find "$WORK/lspatch-out" -maxdepth 1 -type f -name '*-lspatched.apk')
          [ "${#PATCHED[@]}" -eq 1 ]
          cp "${PATCHED[0]}" "$WORK/bundle/base.apk"

          # LSPatch signs its output, but can leave uncompressed native libraries off a
          # 16 KiB page boundary. Alignment must precede the final signature because
          # zipalign invalidates the APK signature. Preserve that layout while signing;
          # LSPatch stores its libraries under assets/ instead of the conventional lib/.
          # Keep the original until both steps succeed so a failed tool invocation cannot
          # leave a partial base APK.
          ALIGNED_BASE="$WORK/base-aligned.apk"
          SIGNED_BASE="$WORK/base-aligned-signed.apk"
          "$ZIPALIGN" -f -P 16 4 "$WORK/bundle/base.apk" "$ALIGNED_BASE"
          "$APKSIGNER" sign \
            --v4-signing-enabled false \
            --alignment-preserved true \
            --ks "$PATCH_KEY" \
            --ks-pass pass:123456 \
            --ks-key-alias key0 \
            --key-pass pass:123456 \
            --out "$SIGNED_BASE" \
            "$ALIGNED_BASE"
          mv "$SIGNED_BASE" "$WORK/bundle/base.apk"
          rm -f "$ALIGNED_BASE"

          FINAL_ENTRIES=(base.apk)
          for split_name in "${SPLIT_NAMES[@]}"; do
            "$APKSIGNER" sign \
              --v4-signing-enabled false \
              --ks "$PATCH_KEY" \
              --ks-pass pass:123456 \
              --ks-key-alias key0 \
              --key-pass pass:123456 \
              --out "$WORK/bundle/$split_name" \
              "$WORK/xapk/$split_name"
            FINAL_ENTRIES+=("$split_name")
          done

          HOST_CERT=$(keytool -list -v -keystore "$PATCH_KEY" -storepass 123456 -alias key0 2>/dev/null \
            | awk '/SHA256:/ && !digest {digest=$2} END {print digest}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test -n "$HOST_CERT"
          EXPECTED_HOST_CERT=$(printf '%s' "$EXPECTED_HOST_CERT" \
            | tr -d ':' | tr '[:upper:]' '[:lower:]')
          [ "$HOST_CERT" = "$EXPECTED_HOST_CERT" ]
          for apk_name in "${FINAL_ENTRIES[@]}"; do
            APK="$WORK/bundle/$apk_name"
            CERT_OUTPUT="$WORK/${apk_name}.certificates.txt"
            "$APKSIGNER" verify --print-certs "$APK" > "$CERT_OUTPUT"
            CERT=$(awk -F': ' \
              '/certificate SHA-256 digest:/ && !digest {digest=$NF} END {print digest}' \
              "$CERT_OUTPUT" | tr -d ':' | tr '[:upper:]' '[:lower:]')
            if [ "$CERT" != "$HOST_CERT" ]; then
              echo "Certificate mismatch for $apk_name: expected $HOST_CERT, got ${CERT:-<empty>}" >&2
              exit 1
            fi
          done

          LSPATCH_CONFIG=$(unzip -p "$WORK/bundle/base.apk" assets/lspatch/config.json)
          jq -e '.useManager == false and .sigBypassLevel == 2
            and .lspConfig.API_CODE == 102
            and .lspConfig.VERSION_CODE == 487
            and .lspConfig.VERSION_NAME == "1.2"' \
            <<< "$LSPATCH_CONFIG" >/dev/null
          MODULE_SHA=$(sha256sum "$MODULE_APK" | awk '{print $1}')
          EMBEDDED_MODULE_SHA=$(unzip -p "$WORK/bundle/base.apk" \
            "assets/lspatch/modules/${MODULE_ID}.apk" | sha256sum | awk '{print $1}')
          SOURCE_BASE_SHA=$(sha256sum "$BASE_APK" | awk '{print $1}')
          EMBEDDED_ORIGIN_SHA=$(unzip -p "$WORK/bundle/base.apk" \
            assets/lspatch/origin.apk | sha256sum | awk '{print $1}')
          [ "$MODULE_SHA" = "$EMBEDDED_MODULE_SHA" ]
          [ "$SOURCE_BASE_SHA" = "$EMBEDDED_ORIGIN_SHA" ]

          for split_name in "${SPLIT_NAMES[@]}"; do
            "$ZIPALIGN" -c -P 16 -v 4 "$WORK/bundle/$split_name" >/dev/null
          done
          BASE_ALIGNMENT="$WORK/base-alignment.txt"
          "$ZIPALIGN" -c -P 16 -v 4 "$WORK/bundle/base.apk" > "$BASE_ALIGNMENT" 2>&1 || true
          grep -Eq 'assets/lspatch/so/arm64-v8a/liblspatch\.so \(OK\)' "$BASE_ALIGNMENT"
          UNEXPECTED_BAD=$(grep 'BAD' "$BASE_ALIGNMENT" \
            | grep -Ev 'assets/lspatch/so/(armeabi-v7a|x86|x86_64)/liblspatch\.so \(BAD - ' || true)
          test -z "$UNEXPECTED_BAD"

          cp "$MANIFEST" "$WORK/bundle/manifest.json"
          if [ "$VERSION_NAME" = 'unknown' ]; then
            VERSION_LABEL="code${VERSION_CODE}"
          else
            VERSION_LABEL=$(printf '%s' "$VERSION_NAME" | tr -c 'A-Za-z0-9._-' '_')
            [ -n "$VERSION_LABEL" ] || VERSION_LABEL="code${VERSION_CODE}"
          fi
          OUT="$GITHUB_WORKSPACE/OnceWorld_${VERSION_LABEL}_LSPatched_OWKit_ARM64_${MODULE_SHA_SHORT}_${NONCE}.apks"
          (
            cd "$WORK/bundle"
            zip -q -0 "$OUT" "${FINAL_ENTRIES[@]}" manifest.json
          )
          unzip -tq "$OUT" >/dev/null

          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"
          echo "VERSION_LABEL=$VERSION_LABEL" >> "$GITHUB_ENV"

      - name: Publish short-lived download
        env:
          GH_TOKEN: ${{ github.token }}
          NONCE: ${{ inputs.nonce }}
        run: |
          set -euo pipefail
          TAG="onceworld-lspatch-${NONCE}"
          gh release create "$TAG" "$OUT#$(basename "$OUT")" \
            --repo "$GITHUB_REPOSITORY" \
            --title "OnceWorld ${VERSION_LABEL} OWKit ${MODULE_SHA_SHORT}" \
            --notes "Temporary private ARM64 OnceWorld build for ${PACKAGE_NAME}. Source ${SOURCE_KIND}. Module ${MODULE_SHA_SHORT}. Automatically removed by the lspatch janitor."
