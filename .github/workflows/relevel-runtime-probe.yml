name: ReLevel cloud runtime preflight
on:
  push:
    branches: [codex/relevel-online]
    paths:
      - .github/workflows/relevel-runtime-probe.yml
      - scripts/relevel/probe-host.sh
      - scripts/relevel/boot-android.sh
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  arm-host:
    needs: play-source
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check native Android runtime requirements
        run: bash scripts/relevel/probe-host.sh
      - name: Boot native ARM64 Android
        run: bash scripts/relevel/boot-android.sh
      - uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.12'
      - name: Install the original Google Play split set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name relevel-play-source --dir "$RUNNER_TEMP/relevel-play"
          mapfile -t APKS < <(find "$RUNNER_TEMP/relevel-play" -name '*.apk' -type f | sort)
          test "${#APKS[@]}" -gt 0
          adb -s 127.0.0.1:5555 install-multiple -r "${APKS[@]}"
          adb -s 127.0.0.1:5555 shell dumpsys package work.ponix.relevel | grep -E 'versionCode=|versionName='
          timeout 15s adb -s 127.0.0.1:5555 shell am start -W -n work.ponix.relevel/com.unity3d.player.UnityPlayerGameActivity || true
          sleep 4
          adb -s 127.0.0.1:5555 shell pidof work.ponix.relevel || true
          adb -s 127.0.0.1:5555 logcat -b crash -d -t 70
          adb -s 127.0.0.1:5555 shell am force-stop work.ponix.relevel
      - name: Fetch the verified prebuilt module and matching instrumentation stack
        env:
          GH_TOKEN: ${{ github.token }}
          RELEVEL_CI_TRANSFER_KEY: ${{ secrets.RELEVEL_CI_TRANSFER_KEY }}
        run: |
          set -Eeuo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name relevel-runtime-inputs --dir "$RUNNER_TEMP/relevel-inputs"
          mkdir "$RUNNER_TEMP/relevel-tools"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:RELEVEL_CI_TRANSFER_KEY -in "$RUNNER_TEMP/relevel-inputs/tools.enc" | tar -xz -C "$RUNNER_TEMP/relevel-tools"
          cp "$RUNNER_TEMP/relevel-inputs/app-release.apk" "$RUNNER_TEMP/relevel-module.apk"
          curl --fail --silent --show-error https://api.github.com/repos/zer0def/undetected-frida/releases/latest > "$RUNNER_TEMP/frida-release.json"
          VERSION=$(jq -r .tag_name "$RUNNER_TEMP/frida-release.json")
          URL=$(jq -r '.assets[] | select(.name | test("server-.*-android-arm64.xz$")) | .browser_download_url' "$RUNNER_TEMP/frida-release.json")
          python -m pip install --disable-pip-version-check --quiet "frida==$VERSION" frida-tools
          python -m pip install --disable-pip-version-check --quiet pyelftools==0.33 androguard==4.1.3
          curl --fail -L --silent --show-error "$URL" | xz -d > "$RUNNER_TEMP/uf-server"
          adb -s 127.0.0.1:5555 push "$RUNNER_TEMP/uf-server" /data/local/tmp/uf-server
          adb -s 127.0.0.1:5555 shell chmod 700 /data/local/tmp/uf-server
          adb -s 127.0.0.1:5555 shell '/data/local/tmp/uf-server -D </dev/null >/dev/null 2>&1'
          sha256sum "$RUNNER_TEMP/uf-server" "$RUNNER_TEMP/relevel-module.apk"
      - name: Bootstrap the real module before Unity startup
        if: false
        timeout-minutes: 3
        run: |
          python "$RUNNER_TEMP/relevel-tools/tools/cloud/bootstrap_probe.py" \
            --serial 127.0.0.1:5555 --module "$RUNNER_TEMP/relevel-module.apk" \
            --output "$RUNNER_TEMP/relevel-bootstrap.json"
      - name: Capture both independent source launches
        timeout-minutes: 6
        run: |
          python "$RUNNER_TEMP/relevel-tools/tools/cloud/capture.py" --serial 127.0.0.1:5555 \
            --source "$RUNNER_TEMP/relevel-play" --module "$RUNNER_TEMP/relevel-module.apk" \
            --output "$RUNNER_TEMP/relevel-capture" --late
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: relevel-capture
          path: ${{ runner.temp }}/relevel-capture
          retention-days: 1
          if-no-files-found: error
      - name: Collect disposable Android diagnostics
        if: always()
        run: timeout 15s docker exec relevel-android /system/bin/sh -c 'getprop sys.boot_completed; ps -A; logcat -d -t 160' || true
      - name: Remove disposable Android container
        if: always()
        run: docker rm -f relevel-android 2>/dev/null || true
  play-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7.0.1
        with:
          repository: Jordan231111/ReLevel
          ref: codex/relevel-cloud
          path: relevel-tools
          token: ${{ secrets.AE_MODULE_REPO_TOKEN }}
          persist-credentials: false
      - name: Stage private module inputs outside the privileged runtime
        env:
          GH_TOKEN: ${{ secrets.AE_MODULE_REPO_TOKEN }}
          RELEVEL_CI_TRANSFER_KEY: ${{ secrets.RELEVEL_CI_TRANSFER_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir "$RUNNER_TEMP/relevel-inputs"
          TAG=$(gh api 'repos/Jordan231111/ReLevel/releases?per_page=30' --jq '[.[] | select(.draft == false and (.tag_name | test("^module-[a-f0-9]{40}$"))) | select(any(.assets[]; .name == "app-release.apk" and .state == "uploaded"))][0].tag_name')
          [[ "$TAG" =~ ^module-[a-f0-9]{40}$ ]]
          gh release download "$TAG" --repo Jordan231111/ReLevel --pattern app-release.apk --dir "$RUNNER_TEMP/relevel-inputs"
          tar --exclude=.git -czf - -C relevel-tools . | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass env:RELEVEL_CI_TRANSFER_KEY -out "$RUNNER_TEMP/relevel-inputs/tools.enc"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: relevel-runtime-inputs
          path: ${{ runner.temp }}/relevel-inputs/*
          retention-days: 1
          if-no-files-found: error
      - name: Fetch ReLevel from Google Play
        env:
          GPLAYDL_API_KEY: ${{ secrets.GPLAYDL_API_KEY }}
          PLAY_ACCOUNT_EMAIL: ${{ secrets.GPLAYDL_GLOBAL_EMAIL }}
        run: |
          set -Eeuo pipefail
          SOURCE="$RUNNER_TEMP/relevel-play"
          trap 'rm -f "$SOURCE/aria2-input"' EXIT
          python3 -m pip install --disable-pip-version-check --no-compile --quiet 'gplaydl==4.2.1'
          command -v aria2c >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y -qq aria2; }
          python3 scripts/download-play-apks.py --package work.ponix.relevel \
            --architecture arm64-v8a --locale en-US --account-email "$PLAY_ACCOUNT_EMAIL" \
            --expected-version unknown --metadata-source google-play --output "$SOURCE"
          python3 - "$SOURCE" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1]);m=json.loads((root/'manifest.json').read_text())
          m['sha256']={p.name:hashlib.file_digest(p.open('rb'),'sha256').hexdigest() for p in root.glob('*.apk')}
          (root/'play-provenance.json').write_text(json.dumps(m,indent=2))
          print(json.dumps(m,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: relevel-play-source
          path: |
            ${{ runner.temp }}/relevel-play/*.apk
            ${{ runner.temp }}/relevel-play/manifest.json
            ${{ runner.temp }}/relevel-play/play-provenance.json
          retention-days: 1
          if-no-files-found: error
