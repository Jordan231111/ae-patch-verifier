name: Prepare requested workshop download
run-name: Workshop ${{ fromJSON(inputs.candidate).variant }} ${{ inputs.nonce }}

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Release identity from the catalog request
        required: true
        type: string
      nonce:
        description: Request identifier
        required: true
        type: string
      verify_only:
        description: Verify the output without publishing
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: workshop-private-${{ fromJSON(inputs.candidate).variant }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Prepare Android and archive tools
        run: |
          # The unmodified Ubuntu package is 9 KB. Extract the checked tool locally.
          package=scripts/catalog/tools/zipmerge_1.11.4-2_amd64.deb
          fingerprint=$(jq -er '.packager.zipmergeSha256' scripts/catalog/inputs.json)
          printf '%s  %s\n' "$fingerprint" "$package" | sha256sum --check --status
          dpkg-deb --extract "$package" "$RUNNER_TEMP/workshop-zip"
          zip_bin="$RUNNER_TEMP/workshop-zip/usr/bin"
          if "$zip_bin/zipmerge" -V; then
            echo "$zip_bin" >> "$GITHUB_PATH"
          else
            echo "::warning::Using the portable ZIP writer"
          fi
          command -v aria2c >/dev/null || sudo apt-get install -y --no-install-recommends aria2
          if [ ! -x "$ANDROID_HOME/build-tools/37.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;37.0.0' >/dev/null
          fi
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"
      - name: Prepare store delivery client
        if: fromJSON(inputs.candidate).source == 'google-play'
        run: bash scripts/install-play-client.sh
      - name: Load shared Android signing identity
        env:
          TEMPLATE_KS_BASE64: ${{ secrets.TEMPLATE_KS_BASE64 }}
          TEMPLATE_KS_PASS: ${{ secrets.TEMPLATE_KS_PASS }}
          TEMPLATE_KEY_ALIAS: ${{ secrets.TEMPLATE_KEY_ALIAS }}
          TEMPLATE_KEY_PASS: ${{ secrets.TEMPLATE_KEY_PASS }}
          TEMPLATE_CERT_SHA256: ${{ vars.TEMPLATE_CERT_SHA256 }}
        run: python3 scripts/setup_shared_signing.py

      - name: Package the original and verify the finished download
        id: catalog_bundle
        env:
          GH_TOKEN: ${{ github.token }}
          MODULE_READ_TOKEN: ${{ secrets.AE_MODULE_REPO_TOKEN }}
          PLAY_EMAIL: ${{ secrets.GPLAYDL_GLOBAL_EMAIL }}
          GPLAYDL_API_KEY: ${{ secrets.GPLAYDL_API_KEY }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          CANDIDATE: ${{ inputs.candidate }}
        run: python scripts/catalog/refresh.py private
      - name: Deliver the verified catalog edition
        if: steps.catalog_bundle.outputs.file != ''
        uses: ./.github/actions/deliver-catalog
        with:
          file: ${{ steps.catalog_bundle.outputs.file }}
          nonce: ${{ inputs.nonce }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Remove staged signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/shared-android-signing.p12"
