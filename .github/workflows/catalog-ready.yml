name: Prepare requested workshop download
run-name: Workshop ${{ fromJSON(inputs.candidate).variant }} ${{ inputs.nonce }}

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Release identity from the catalog request
        required: true
        type: string
      nonce:
        description: Request identifier
        required: true
        type: string
      verify_only:
        description: Verify the output without publishing
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: workshop-private-${{ fromJSON(inputs.candidate).variant }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Prepare Android and store delivery tools
        run: |
          python -m pip install --quiet --no-compile --disable-pip-version-check 'gplaydl==4.2.1' &
          play_client=$!
          if ! command -v zipmerge >/dev/null; then
            sudo apt-get install -qq -y --no-install-recommends zipmerge || echo "Using the standard ZIP writer"
          fi
          command -v aria2c >/dev/null || sudo apt-get install -y --no-install-recommends aria2
          if [ ! -x "$ANDROID_HOME/build-tools/37.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;37.0.0' >/dev/null
          fi
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"
          wait "$play_client"
      - name: Package the original and verify the finished download
        id: catalog_bundle
        env:
          GH_TOKEN: ${{ github.token }}
          MODULE_READ_TOKEN: ${{ secrets.AE_MODULE_REPO_TOKEN }}
          HOST_KEYSTORE: ${{ secrets.RELEVEL_HOST_KEYSTORE_BASE64 }}
          PLAY_EMAIL: ${{ secrets.GPLAYDL_GLOBAL_EMAIL }}
          GPLAYDL_API_KEY: ${{ secrets.GPLAYDL_API_KEY }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          CANDIDATE: ${{ inputs.candidate }}
        run: python scripts/catalog/refresh.py private
      - name: Deliver the verified catalog edition
        if: steps.catalog_bundle.outputs.file != ''
        uses: ./.github/actions/deliver-catalog
        with:
          file: ${{ steps.catalog_bundle.outputs.file }}
          nonce: ${{ inputs.nonce }}
        env:
          GH_TOKEN: ${{ github.token }}
