name: Build LSPatched APKS

run-name: AE ${{ inputs.region }} ${{ inputs.runtimeTarget }} ${{ inputs.sourceKind }} ${{ inputs.expectedVersionName }} ${{ inputs.nonce }}

on:
  workflow_dispatch:
    inputs:
      catalog:
        description: Optional release receipt requested by the app catalog
        required: false
        type: string
      region:
        description: Game region
        required: true
        type: choice
        options: [global, japan]
      variant:
        description: Embedded module APK
        required: true
        type: choice
        options: [release, debug]
      moduleSource:
        description: Module source contract
        required: true
      moduleSha:
        description: Server-resolved module commit to embed
        required: true
      moduleRef:
        description: Branch the module commit was resolved from
        required: true
      moduleDigest:
        description: SHA-256 of the selected module release asset
        required: false
      expectedRecipe:
        description: Checked AE packaging recipe
        required: false
      packageName:
        description: Google Play package
        required: true
      architecture:
        description: Google Play guest ABI
        required: true
        type: choice
        options: [arm64-v8a]
      runtimeTarget:
        description: Installation target
        required: true
        type: choice
        options: [phone-arm64]
      sourceKind:
        description: Game package source
        required: true
        type: choice
        options: [google-play, apkpure]
      expectedVersionCode:
        description: Source version code when available
        required: true
      expectedVersionName:
        description: Google Play listing version
        required: true
      playLocale:
        description: Google Play locale
        required: true
      nonce:
        description: Request nonce from Vercel
        required: true

permissions:
  actions: read
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.12'

      - name: Verify the checkout patcher and prepare build inputs
        id: inputs
        env:
          REGION: ${{ inputs.region }}
          PACKAGE_NAME: ${{ inputs.packageName }}
          ARCHITECTURE: ${{ inputs.architecture }}
          RUNTIME_TARGET: ${{ inputs.runtimeTarget }}
          SOURCE_KIND: ${{ inputs.sourceKind }}
          EXPECTED_VERSION_CODE: ${{ inputs.expectedVersionCode }}
          EXPECTED_VERSION_NAME: ${{ inputs.expectedVersionName }}
          PLAY_LOCALE: ${{ inputs.playLocale }}
          PLAY_ACCOUNT_EMAIL: ${{ secrets.GPLAYDL_GLOBAL_EMAIL }}
          GPLAYDL_API_KEY: ${{ secrets.GPLAYDL_API_KEY }}
          MODULE_SHA: ${{ inputs.moduleSha }}
          MODULE_ASSET_DIGEST: ${{ inputs.moduleDigest }}
          EXPECTED_RECIPE: ${{ inputs.expectedRecipe }}
          CANDIDATE: ${{ inputs.catalog }}
          MODULE_REPO: ${{ secrets.AE_MODULE_REPO }}
          MODULE_ASSET: app-${{ inputs.variant }}.apk
          MODULE_SOURCE: ${{ inputs.moduleSource }}
          GH_TOKEN: ${{ secrets.AE_MODULE_REPO_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ "$REGION" == 'global' || "$REGION" == 'japan' ]]
          [[ "$PACKAGE_NAME" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$ARCHITECTURE" == 'arm64-v8a' ]]
          [[ "$RUNTIME_TARGET" == 'phone-arm64' ]]
          [[ "$SOURCE_KIND" == 'google-play' || "$SOURCE_KIND" == 'apkpure' ]]
          [[ "$EXPECTED_VERSION_CODE" =~ ^[0-9]+$ ]]
          [[ "$MODULE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MODULE_SOURCE" == main ]]
          test -n "$EXPECTED_VERSION_NAME"
          if [ "$SOURCE_KIND" = google-play ]; then
            test -n "$GPLAYDL_API_KEY"
            test -n "$PLAY_ACCOUNT_EMAIL"
          fi
          test -n "$MODULE_REPO"
          test -n "$GH_TOKEN"

          WORK="$RUNNER_TEMP/ae-lspatch"
          mkdir -p "$WORK"/{bundle,lspatch-out,module,play,source,tools}
          IFS=$'\t' read -r PATCHER_FILE PATCHER_SHA256 PATCHER_NAME PATCHER_BUILD < <(
            jq -er '.anotherEdenPatcher | [.file, .sha256, .versionName, .build] | @tsv' scripts/catalog/inputs.json
          )
          printf '%s  %s\n' "$PATCHER_SHA256" "$PATCHER_FILE" | sha256sum --check --strict -
          COMPANION_URL=$(jq -er '.aeLogin.companion.url' scripts/catalog/inputs.json)
          COMPANION_SHA256=$(jq -er '.aeLogin.companion.sha256' scripts/catalog/inputs.json)
          [[ "$COMPANION_SHA256" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "LSPATCH_JAR=$GITHUB_WORKSPACE/$PATCHER_FILE"
            echo "LSPATCH_NAME=$PATCHER_NAME"
            echo "LSPATCH_BUILD=$PATCHER_BUILD"
          } >> "$GITHUB_ENV"

          (
            if [ "$SOURCE_KIND" = google-play ]; then
              bash scripts/install-play-client.sh
              python3 scripts/download-play-apks.py \
                --package "$PACKAGE_NAME" \
                --architecture "$ARCHITECTURE" \
                --locale "$PLAY_LOCALE" \
                --account-email "$PLAY_ACCOUNT_EMAIL" \
                --expected-version "$EXPECTED_VERSION_NAME" \
                --fast-transfer \
                --metadata-source google-play \
                --output "$WORK/source"
            else
              bash scripts/download-apkpure-xapk.sh \
                "$PACKAGE_NAME" "$ARCHITECTURE" "$EXPECTED_VERSION_CODE" \
                "$EXPECTED_VERSION_NAME" "$WORK/source"
            fi
          ) &
          SOURCE_PID=$!

          (
            gh release download "module-${MODULE_SHA}" \
              --repo "$MODULE_REPO" --pattern "$MODULE_ASSET" --dir "$WORK/module"
            test -s "$WORK/module/$MODULE_ASSET"
            RELEASE_DIGEST=$(gh api "repos/$MODULE_REPO/releases/tags/module-$MODULE_SHA" \
              --jq '.assets[] | select(.name == env.MODULE_ASSET and .state == "uploaded") | .digest')
            [[ "$RELEASE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            [ "$(sha256sum "$WORK/module/$MODULE_ASSET" | awk '{print $1}')" = "${RELEASE_DIGEST#sha256:}" ]
            printf '%s\n' "$WORK/module/$MODULE_ASSET" > "$WORK/module-apk.path"
          ) &
          MODULE_PID=$!

          (
            curl -L --fail --silent --show-error --connect-timeout 20 --max-time 120 \
              -o "$WORK/tools/microg.apk" "$COMPANION_URL"
            [ "$(sha256sum "$WORK/tools/microg.apk" | awk '{print $1}')" = "$COMPANION_SHA256" ]
          ) &
          COMPANION_PID=$!

          SOURCE_STATUS=0
          MODULE_STATUS=0
          COMPANION_STATUS=0
          wait "$SOURCE_PID" || SOURCE_STATUS=$?
          wait "$MODULE_PID" || MODULE_STATUS=$?
          wait "$COMPANION_PID" || COMPANION_STATUS=$?
          if [ "$SOURCE_STATUS" -ne 0 ] || [ "$MODULE_STATUS" -ne 0 ] || [ "$COMPANION_STATUS" -ne 0 ]; then
            echo "::error::Input preparation failed (source=$SOURCE_STATUS module=$MODULE_STATUS companion=$COMPANION_STATUS)"
            exit 1
          fi
          test -s "$WORK/source/manifest.json"

          test -s "$WORK/module-apk.path"
          MODULE_APK=$(cat "$WORK/module-apk.path")
          python3 scripts/catalog/ae_inputs.py --module "$MODULE_APK" \
            --companion "$WORK/tools/microg.apk" --receipt "$WORK/input-receipt.json"
          echo "MODULE_APK=$MODULE_APK" >> "$GITHUB_ENV"
          echo "AE_INPUT_RECEIPT=$WORK/input-receipt.json" >> "$GITHUB_ENV"
          echo "prebuilt=true" >> "$GITHUB_OUTPUT"

          source "$WORK/source/source.env"
          {
            echo "WORK=$WORK"
            echo "PACKAGE_NAME=$PACKAGE_NAME"
            echo "ARCHITECTURE=$ARCHITECTURE"
            echo "RUNTIME_TARGET=$RUNTIME_TARGET"
            echo "MODULE_SHA_SHORT=${MODULE_SHA:0:7}"
            echo "VERSION_CODE=$VERSION_CODE"
            echo "VERSION_NAME=$VERSION_NAME"
            echo "SOURCE_KIND=$SOURCE_KIND"
          } >> "$GITHUB_ENV"

      - name: Load shared Android signing identity
        env:
          TEMPLATE_KS_BASE64: ${{ secrets.TEMPLATE_KS_BASE64 }}
          TEMPLATE_KS_PASS: ${{ secrets.TEMPLATE_KS_PASS }}
          TEMPLATE_KEY_ALIAS: ${{ secrets.TEMPLATE_KEY_ALIAS }}
          TEMPLATE_KEY_PASS: ${{ secrets.TEMPLATE_KEY_PASS }}
          TEMPLATE_CERT_SHA256: ${{ vars.TEMPLATE_CERT_SHA256 }}
        run: python3 scripts/setup_shared_signing.py

      - name: Patch, sign, and package
        env:
          REGION: ${{ inputs.region }}
          VARIANT: ${{ inputs.variant }}
          MODULE_SOURCE: ${{ inputs.moduleSource }}
          NONCE: ${{ inputs.nonce }}
          EXPECTED_SOURCE_CERT: ${{ inputs.region == 'japan' && vars.AE_JAPAN_SOURCE_CERT_SHA256 || vars.AE_GLOBAL_SOURCE_CERT_SHA256 }}
          EXPECTED_HOST_CERT: ${{ vars.TEMPLATE_CERT_SHA256 }}
        run: |
          set -Eeuo pipefail
          trap 'status=$?; echo "Failed at workflow script line $LINENO: $BASH_COMMAND (exit $status)" >&2; exit $status' ERR
          test -s "$MODULE_APK"
          test -n "$TEMPLATE_KS_PASS"
          test -n "$TEMPLATE_KEY_ALIAS"
          test -n "$EXPECTED_SOURCE_CERT"
          test -n "$EXPECTED_HOST_CERT"

          case "$REGION" in
            japan) DEFAULT_NAME=AnotherEden_Japan ;;
            *) DEFAULT_NAME=AnotherEden_Global ;;
          esac
          TARGET_SUFFIX=''

          KEYSTORE="$TEMPLATE_KS_PATH"
          test -s "$KEYSTORE"

          MANIFEST="$WORK/source/manifest.json"
          jq -e --arg package "$PACKAGE_NAME" --arg code "$VERSION_CODE" \
            '.package_name == $package and (.version_code | tostring) == $code' "$MANIFEST" >/dev/null
          EXPECTED_SPLIT="config.${ARCHITECTURE//-/_}"
          jq -e --arg split "$EXPECTED_SPLIT" 'any(.split_apks[]; .id == $split)' "$MANIFEST" >/dev/null
          BASE_NAME=$(jq -r '.split_apks[] | select(.id == "base") | .file' "$MANIFEST")
          [[ "$BASE_NAME" =~ ^[A-Za-z0-9._-]+\.apk$ ]]
          BASE_APK="$WORK/source/$BASE_NAME"
          test -s "$BASE_APK"
          mapfile -t SPLIT_NAMES < <(jq -r '.split_apks[] | select(.id != "base") | .file' "$MANIFEST")
          [ "${#SPLIT_NAMES[@]}" -gt 0 ]
          for split_name in "${SPLIT_NAMES[@]}"; do
            [[ "$split_name" =~ ^[A-Za-z0-9._-]+\.apk$ ]]
            test -s "$WORK/source/$split_name"
          done

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          ZIPALIGN="$SDK_ROOT/build-tools/35.0.0/zipalign"
          if [ ! -x "$APKSIGNER" ] || [ ! -x "$ZIPALIGN" ]; then
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0' >/dev/null
          fi
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          export PATH="$SDK_ROOT/build-tools/35.0.0:$PATH"
          python3 scripts/catalog/verify_inputs.py --source "$WORK/source" \
            --package "$PACKAGE_NAME" --code "$VERSION_CODE" --source-cert "$EXPECTED_SOURCE_CERT" \
            --module "$MODULE_APK" --module-cert "$EXPECTED_HOST_CERT"

          MODULE_PROP=$(unzip -p "$MODULE_APK" META-INF/xposed/module.prop)
          MODULE_ID=$(awk -F= '$1 == "id" { print $2; exit }' <<< "$MODULE_PROP")
          [[ "$MODULE_ID" =~ ^[A-Za-z0-9._-]+$ ]]
          test -n "$(unzip -Z1 "$MODULE_APK" | grep "^lib/${ARCHITECTURE}/.*\.so$")"
          if [ "$MODULE_SOURCE" = main ]; then
            MODULE_ENTRIES=$(unzip -Z1 "$MODULE_APK")
            grep -Fxq 'META-INF/xposed/java_init.list' <<< "$MODULE_ENTRIES"
            grep -Fxq 'META-INF/xposed/scope.list' <<< "$MODULE_ENTRIES"
            ! grep -Fxq 'assets/xposed_init' <<< "$MODULE_ENTRIES"
            grep -Fxq 'minApiVersion=102' <<< "$MODULE_PROP"
            grep -Fxq 'targetApiVersion=102' <<< "$MODULE_PROP"
          fi

          java -cp "$LSPATCH_JAR" scripts/RunLspatch.java "$LSPATCH_JAR" "$KEYSTORE" \
            -m "$MODULE_APK" \
            -l 2 -f -o "$WORK/lspatch-out" "$BASE_APK"

          mapfile -t PATCHED_BASES < <(find "$WORK/lspatch-out" -maxdepth 1 -type f -name '*-lspatched.apk')
          [ "${#PATCHED_BASES[@]}" -eq 1 ]
          HOST_BASE="${PATCHED_BASES[0]}"
          # Only independently reviewed checkout source can execute in the signing job.
          # Input authorization checked the versioned contract and exact helper bytes.
          if jq -e '.prepared == true' "$AE_INPUT_RECEIPT" >/dev/null; then
            REVIEWED_HELPER=$(jq -er '.helper' "$AE_INPUT_RECEIPT")
            java -cp "$LSPATCH_JAR" "$REVIEWED_HELPER" \
              "$BASE_APK" "$HOST_BASE" "$WORK/base-microg-unsigned.apk" "$WORK/tools/microg.apk"
            HOST_BASE="$WORK/base-microg-unsigned.apk"
          fi
          ALIGNED_BASE="$WORK/base-aligned.apk"
          FINAL_BASE="$WORK/bundle/$BASE_NAME"
          "$ZIPALIGN" -f -P 16 4 "$HOST_BASE" "$ALIGNED_BASE"
          "$APKSIGNER" sign \
            --v4-signing-enabled false --alignment-preserved true \
            --ks "$KEYSTORE" --ks-pass env:TEMPLATE_KS_PASS \
            --ks-key-alias "$TEMPLATE_KEY_ALIAS" --key-pass env:TEMPLATE_KEY_PASS \
            --out "$FINAL_BASE" "$ALIGNED_BASE"
          rm -f "$ALIGNED_BASE"

          FINAL_ENTRIES=("$BASE_NAME")
          for split_name in "${SPLIT_NAMES[@]}"; do
            "$APKSIGNER" sign \
              --v4-signing-enabled false \
              --ks "$KEYSTORE" --ks-pass env:TEMPLATE_KS_PASS \
              --ks-key-alias "$TEMPLATE_KEY_ALIAS" --key-pass env:TEMPLATE_KEY_PASS \
              --out "$WORK/bundle/$split_name" "$WORK/source/$split_name"
            FINAL_ENTRIES+=("$split_name")
          done
          cp "$MANIFEST" "$WORK/bundle/manifest.json"

          FINAL_CERT_OUTPUT="$WORK/final-certificates.txt"
          "$APKSIGNER" verify --print-certs "$FINAL_BASE" > "$FINAL_CERT_OUTPUT"
          FINAL_CERT=$(awk -F': ' \
            '/certificate SHA-256 digest:/ && !digest {digest=$NF} END {print digest}' \
            "$FINAL_CERT_OUTPUT" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          EXPECTED_HOST_CERT=$(printf '%s' "$EXPECTED_HOST_CERT" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          [ "$FINAL_CERT" = "$EXPECTED_HOST_CERT" ]

          LSPATCH_CONFIG=$(unzip -p "$FINAL_BASE" assets/lspatch/config.json)
          jq -e --arg name "$LSPATCH_NAME" --argjson build "$LSPATCH_BUILD" '.useManager == false and .sigBypassLevel == 2
            and .lspConfig.API_CODE == 102
            and .lspConfig.VERSION_CODE == $build
            and .lspConfig.VERSION_NAME == $name' <<< "$LSPATCH_CONFIG" >/dev/null

          for split_name in "${SPLIT_NAMES[@]}"; do
            "$ZIPALIGN" -c -P 16 -v 4 "$WORK/bundle/$split_name" >/dev/null
          done
          BASE_ALIGNMENT="$WORK/base-alignment.txt"
          "$ZIPALIGN" -c -P 16 -v 4 "$FINAL_BASE" > "$BASE_ALIGNMENT" 2>&1 || true
          grep -Fq "assets/lspatch/so/${ARCHITECTURE}/liblspatch.so (OK)" "$BASE_ALIGNMENT"
          UNEXPECTED_BAD=$(grep 'BAD' "$BASE_ALIGNMENT" | grep -v 'assets/lspatch/so/' || true)
          test -z "$UNEXPECTED_BAD"

          OUT="$PWD/${DEFAULT_NAME}_${VERSION_NAME}_LSPatched_Ashfur${TARGET_SUFFIX}_${VARIANT}_${MODULE_SHA_SHORT}_${NONCE}.apks"
          (cd "$WORK/bundle" && zip -q -0 "$OUT" "${FINAL_ENTRIES[@]}" manifest.json)
          {
            echo "OUT=$OUT"
            echo "DEFAULT_NAME=$DEFAULT_NAME"
            echo "TARGET_SUFFIX=$TARGET_SUFFIX"
          } >> "$GITHUB_ENV"

      - name: Publish raw APKS artifact
        if: inputs.catalog == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ env.OUT }}
          archive: false
          if-no-files-found: error
          retention-days: 1
      - name: Verify the requested catalog edition
        id: catalog_bundle
        if: inputs.catalog != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.catalog }}
          MODULE_SHA: ${{ inputs.moduleSha }}
        run: python3 scripts/catalog/refresh.py existing
      - name: Deliver the verified catalog edition
        if: steps.catalog_bundle.outputs.file != ''
        uses: ./.github/actions/deliver-catalog
        with:
          file: ${{ steps.catalog_bundle.outputs.file }}
          nonce: ${{ inputs.nonce }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Remove staged signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/shared-android-signing.p12"
