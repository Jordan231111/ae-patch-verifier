name: Build LSPatched APKS

run-name: AE ${{ inputs.region }} ${{ inputs.runtimeTarget }} ${{ inputs.sourceKind }} ${{ inputs.expectedVersionName }} ${{ inputs.nonce }}

on:
  workflow_dispatch:
    inputs:
      region:
        description: Game region
        required: true
        type: choice
        options: [global, japan]
      variant:
        description: Embedded module APK
        required: true
        type: choice
        options: [release, debug]
      moduleSource:
        description: Module source contract
        required: true
      moduleSha:
        description: Server-resolved module commit to embed
        required: true
      moduleRef:
        description: Branch the module commit was resolved from
        required: true
      packageName:
        description: Google Play package
        required: true
      architecture:
        description: Google Play guest ABI
        required: true
        type: choice
        options: [arm64-v8a]
      runtimeTarget:
        description: Installation target
        required: true
        type: choice
        options: [phone-arm64, houdini-x86_64]
      sourceKind:
        description: Game package source
        required: true
        type: choice
        options: [google-play, apkpure]
      expectedVersionCode:
        description: Source version code when available
        required: true
      expectedVersionName:
        description: Google Play listing version
        required: true
      playLocale:
        description: Google Play locale
        required: true
      nonce:
        description: Request nonce from Vercel
        required: true

permissions:
  contents: write

env:
  LSPATCH_VERSION: v1.2-487
  LSPATCH_JAR_URL: https://github.com/JingMatrix/LSPatch/releases/download/v1.2/lspatch-v1.2-487-release.jar
  LSPATCH_JAR_SHA256: d238fdc414d121b7fa454d8b4ccf420df3a8c97d563761861ff92bd9c5da2165

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.12'

      - name: Prepare app source, module, and patcher in parallel
        id: inputs
        env:
          REGION: ${{ inputs.region }}
          PACKAGE_NAME: ${{ inputs.packageName }}
          ARCHITECTURE: ${{ inputs.architecture }}
          RUNTIME_TARGET: ${{ inputs.runtimeTarget }}
          SOURCE_KIND: ${{ inputs.sourceKind }}
          EXPECTED_VERSION_CODE: ${{ inputs.expectedVersionCode }}
          EXPECTED_VERSION_NAME: ${{ inputs.expectedVersionName }}
          PLAY_LOCALE: ${{ inputs.playLocale }}
          PLAY_ACCOUNT_EMAIL: ${{ secrets.GPLAYDL_GLOBAL_EMAIL }}
          GPLAYDL_API_KEY: ${{ secrets.GPLAYDL_API_KEY }}
          MODULE_SHA: ${{ inputs.moduleSha }}
          MODULE_REPO: ${{ secrets.AE_MODULE_REPO }}
          MODULE_ASSET: app-${{ inputs.variant }}.apk
          GH_TOKEN: ${{ secrets.AE_MODULE_REPO_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ "$REGION" == 'global' || "$REGION" == 'japan' ]]
          [[ "$PACKAGE_NAME" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$ARCHITECTURE" == 'arm64-v8a' ]]
          [[ "$RUNTIME_TARGET" == 'phone-arm64' || "$RUNTIME_TARGET" == 'houdini-x86_64' ]]
          [[ "$SOURCE_KIND" == 'google-play' || "$SOURCE_KIND" == 'apkpure' ]]
          [[ "$EXPECTED_VERSION_CODE" =~ ^[0-9]+$ ]]
          [[ "$MODULE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$EXPECTED_VERSION_NAME"
          if [ "$SOURCE_KIND" = google-play ]; then
            test -n "$GPLAYDL_API_KEY"
            test -n "$PLAY_ACCOUNT_EMAIL"
          fi
          test -n "$MODULE_REPO"
          test -n "$GH_TOKEN"

          WORK="$RUNNER_TEMP/ae-lspatch"
          mkdir -p "$WORK"/{bundle,lspatch-out,module,play,source,tools}

          (
            if [ "$SOURCE_KIND" = google-play ]; then
              python3 -m pip install --disable-pip-version-check --no-compile --quiet 'gplaydl==4.2.1'
              python3 scripts/download-play-apks.py \
                --package "$PACKAGE_NAME" \
                --architecture "$ARCHITECTURE" \
                --locale "$PLAY_LOCALE" \
                --account-email "$PLAY_ACCOUNT_EMAIL" \
                --expected-version "$EXPECTED_VERSION_NAME" \
                --metadata-source google-play \
                --output "$WORK/source"
            else
              bash scripts/download-apkpure-xapk.sh \
                "$PACKAGE_NAME" "$ARCHITECTURE" "$EXPECTED_VERSION_CODE" \
                "$EXPECTED_VERSION_NAME" "$WORK/source"
            fi
          ) &
          SOURCE_PID=$!

          (
            if gh release download "module-${MODULE_SHA}" \
              --repo "$MODULE_REPO" \
              --pattern "$MODULE_ASSET" \
              --dir "$WORK/module" 2>/dev/null \
              && [ -s "$WORK/module/$MODULE_ASSET" ]; then
              printf '%s\n' "$WORK/module/$MODULE_ASSET" > "$WORK/module-apk.path"
            fi
          ) &
          MODULE_PID=$!

          curl -L --fail --silent --show-error \
            --connect-timeout 20 --max-time 120 \
            -o "$WORK/tools/lspatch.jar" "$LSPATCH_JAR_URL" &
          PATCHER_PID=$!

          SOURCE_STATUS=0
          MODULE_STATUS=0
          PATCHER_STATUS=0
          wait "$SOURCE_PID" || SOURCE_STATUS=$?
          wait "$MODULE_PID" || MODULE_STATUS=$?
          wait "$PATCHER_PID" || PATCHER_STATUS=$?
          if [ "$SOURCE_STATUS" -ne 0 ] || [ "$MODULE_STATUS" -ne 0 ] || [ "$PATCHER_STATUS" -ne 0 ]; then
            echo "::error::Input preparation failed (source=$SOURCE_STATUS module=$MODULE_STATUS patcher=$PATCHER_STATUS)"
            exit 1
          fi
          test -s "$WORK/source/manifest.json"
          test -s "$WORK/tools/lspatch.jar"

          if [ -s "$WORK/module-apk.path" ]; then
            MODULE_APK=$(cat "$WORK/module-apk.path")
            echo "MODULE_APK=$MODULE_APK" >> "$GITHUB_ENV"
            echo "prebuilt=true" >> "$GITHUB_OUTPUT"
          else
            echo "prebuilt=false" >> "$GITHUB_OUTPUT"
          fi

          source "$WORK/source/source.env"
          {
            echo "WORK=$WORK"
            echo "PACKAGE_NAME=$PACKAGE_NAME"
            echo "ARCHITECTURE=$ARCHITECTURE"
            echo "RUNTIME_TARGET=$RUNTIME_TARGET"
            echo "MODULE_SHA_SHORT=${MODULE_SHA:0:7}"
            echo "VERSION_CODE=$VERSION_CODE"
            echo "VERSION_NAME=$VERSION_NAME"
            echo "SOURCE_KIND=$SOURCE_KIND"
          } >> "$GITHUB_ENV"

      - name: Compile module when no prebuilt exists
        if: steps.inputs.outputs.prebuilt != 'true'
        env:
          MODULE_SHA: ${{ inputs.moduleSha }}
          MODULE_REF: ${{ inputs.moduleRef }}
          MODULE_REPO: ${{ secrets.AE_MODULE_REPO }}
          GH_TOKEN: ${{ secrets.AE_MODULE_REPO_TOKEN }}
          VARIANT: ${{ inputs.variant }}
        run: |
          set -Eeuo pipefail
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;25.2.9519653' >/dev/null
          git init -q "$WORK/module-src"
          git -C "$WORK/module-src" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${MODULE_REPO}.git"
          if ! git -C "$WORK/module-src" fetch --depth 1 origin "$MODULE_SHA"; then
            git -C "$WORK/module-src" fetch --depth 50 origin "$MODULE_REF"
          fi
          git -C "$WORK/module-src" checkout --detach "$MODULE_SHA"
          chmod +x "$WORK/module-src/gradlew"
          case "$VARIANT" in
            debug)
              (cd "$WORK/module-src" && ./gradlew :app:assembleDebug -q)
              MODULE_APK="$WORK/module-src/app/build/outputs/apk/debug/app-debug.apk"
              ;;
            *)
              (cd "$WORK/module-src" && ./gradlew :app:assembleRelease -q)
              MODULE_APK="$WORK/module-src/app/build/outputs/apk/release/app-release.apk"
              ;;
          esac
          test -s "$MODULE_APK"
          echo "MODULE_APK=$MODULE_APK" >> "$GITHUB_ENV"

      - name: Patch, sign, and package
        env:
          REGION: ${{ inputs.region }}
          VARIANT: ${{ inputs.variant }}
          MODULE_SOURCE: ${{ inputs.moduleSource }}
          NONCE: ${{ inputs.nonce }}
          EXPECTED_SOURCE_CERT: ${{ inputs.region == 'japan' && vars.AE_JAPAN_SOURCE_CERT_SHA256 || vars.AE_GLOBAL_SOURCE_CERT_SHA256 }}
          AE_HOST_KEYSTORE_BASE64: ${{ secrets.AE_HOST_KEYSTORE_BASE64 }}
          AE_HOST_KEYSTORE_PASSWORD: ${{ secrets.AE_HOST_KEYSTORE_PASSWORD }}
          AE_HOST_KEY_ALIAS: ${{ secrets.AE_HOST_KEY_ALIAS }}
          EXPECTED_HOST_CERT: ${{ vars.AE_HOST_CERT_SHA256 }}
        run: |
          set -Eeuo pipefail
          trap 'status=$?; echo "Failed at workflow script line $LINENO: $BASH_COMMAND (exit $status)" >&2; exit $status' ERR
          test -s "$MODULE_APK"
          test -n "$AE_HOST_KEYSTORE_BASE64"
          test -n "$AE_HOST_KEYSTORE_PASSWORD"
          test -n "$AE_HOST_KEY_ALIAS"
          test -n "$EXPECTED_SOURCE_CERT"
          test -n "$EXPECTED_HOST_CERT"

          case "$REGION" in
            japan) DEFAULT_NAME=AnotherEden_Japan ;;
            *) DEFAULT_NAME=AnotherEden_Global ;;
          esac
          case "$RUNTIME_TARGET" in
            houdini-x86_64) TARGET_SUFFIX=_emulator-x86_64 ;;
            *) TARGET_SUFFIX='' ;;
          esac

          KEYSTORE="$RUNNER_TEMP/ae-host-signing.jks"
          printf '%s' "$AE_HOST_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          test -s "$KEYSTORE"

          MANIFEST="$WORK/source/manifest.json"
          jq -e --arg package "$PACKAGE_NAME" --arg code "$VERSION_CODE" \
            '.package_name == $package and (.version_code | tostring) == $code' "$MANIFEST" >/dev/null
          EXPECTED_SPLIT="config.${ARCHITECTURE//-/_}"
          jq -e --arg split "$EXPECTED_SPLIT" 'any(.split_apks[]; .id == $split)' "$MANIFEST" >/dev/null
          BASE_NAME=$(jq -r '.split_apks[] | select(.id == "base") | .file' "$MANIFEST")
          [[ "$BASE_NAME" =~ ^[A-Za-z0-9._-]+\.apk$ ]]
          BASE_APK="$WORK/source/$BASE_NAME"
          test -s "$BASE_APK"
          mapfile -t SPLIT_NAMES < <(jq -r '.split_apks[] | select(.id != "base") | .file' "$MANIFEST")
          [ "${#SPLIT_NAMES[@]}" -gt 0 ]
          for split_name in "${SPLIT_NAMES[@]}"; do
            [[ "$split_name" =~ ^[A-Za-z0-9._-]+\.apk$ ]]
            test -s "$WORK/source/$split_name"
          done

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          ZIPALIGN="$SDK_ROOT/build-tools/35.0.0/zipalign"
          if [ ! -x "$APKSIGNER" ] || [ ! -x "$ZIPALIGN" ]; then
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0' >/dev/null
          fi
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          SOURCE_CERT_OUTPUT="$WORK/source-certificates.txt"
          "$APKSIGNER" verify --print-certs "$BASE_APK" > "$SOURCE_CERT_OUTPUT"
          SOURCE_CERT=$(awk -F': ' \
            '/certificate SHA-256 digest:/ && !digest {digest=$NF} END {print digest}' \
            "$SOURCE_CERT_OUTPUT" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          EXPECTED_SOURCE_CERT=$(printf '%s' "$EXPECTED_SOURCE_CERT" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          [ "$SOURCE_CERT" = "$EXPECTED_SOURCE_CERT" ]

          MODULE_PROP=$(unzip -p "$MODULE_APK" META-INF/xposed/module.prop)
          MODULE_ID=$(awk -F= '$1 == "id" { print $2; exit }' <<< "$MODULE_PROP")
          [[ "$MODULE_ID" =~ ^[A-Za-z0-9._-]+$ ]]
          test -n "$(unzip -Z1 "$MODULE_APK" | grep "^lib/${ARCHITECTURE}/.*\.so$")"
          if [ "$MODULE_SOURCE" = main ]; then
            MODULE_ENTRIES=$(unzip -Z1 "$MODULE_APK")
            grep -Fxq 'META-INF/xposed/java_init.list' <<< "$MODULE_ENTRIES"
            grep -Fxq 'META-INF/xposed/scope.list' <<< "$MODULE_ENTRIES"
            ! grep -Fxq 'assets/xposed_init' <<< "$MODULE_ENTRIES"
            grep -Fxq 'minApiVersion=102' <<< "$MODULE_PROP"
            grep -Fxq 'targetApiVersion=102' <<< "$MODULE_PROP"
          fi

          LSPATCH_JAR="$WORK/tools/lspatch.jar"
          [ "$(sha256sum "$LSPATCH_JAR" | awk '{print $1}')" = "$LSPATCH_JAR_SHA256" ]
          unzip -tq "$LSPATCH_JAR" >/dev/null
          java -jar "$LSPATCH_JAR" \
            -m "$MODULE_APK" \
            -k "$KEYSTORE" "$AE_HOST_KEYSTORE_PASSWORD" "$AE_HOST_KEY_ALIAS" "$AE_HOST_KEYSTORE_PASSWORD" \
            -l 2 -f -o "$WORK/lspatch-out" "$BASE_APK"

          mapfile -t PATCHED_BASES < <(find "$WORK/lspatch-out" -maxdepth 1 -type f -name '*-lspatched.apk')
          [ "${#PATCHED_BASES[@]}" -eq 1 ]
          ALIGNED_BASE="$WORK/base-aligned.apk"
          FINAL_BASE="$WORK/bundle/$BASE_NAME"
          "$ZIPALIGN" -f -P 16 4 "${PATCHED_BASES[0]}" "$ALIGNED_BASE"
          "$APKSIGNER" sign \
            --v4-signing-enabled false --alignment-preserved true \
            --ks "$KEYSTORE" --ks-pass "pass:$AE_HOST_KEYSTORE_PASSWORD" \
            --ks-key-alias "$AE_HOST_KEY_ALIAS" --key-pass "pass:$AE_HOST_KEYSTORE_PASSWORD" \
            --out "$FINAL_BASE" "$ALIGNED_BASE"
          rm -f "$ALIGNED_BASE"

          FINAL_ENTRIES=("$BASE_NAME")
          for split_name in "${SPLIT_NAMES[@]}"; do
            "$APKSIGNER" sign \
              --v4-signing-enabled false \
              --ks "$KEYSTORE" --ks-pass "pass:$AE_HOST_KEYSTORE_PASSWORD" \
              --ks-key-alias "$AE_HOST_KEY_ALIAS" --key-pass "pass:$AE_HOST_KEYSTORE_PASSWORD" \
              --out "$WORK/bundle/$split_name" "$WORK/source/$split_name"
            FINAL_ENTRIES+=("$split_name")
          done
          cp "$MANIFEST" "$WORK/bundle/manifest.json"

          FINAL_CERT_OUTPUT="$WORK/final-certificates.txt"
          "$APKSIGNER" verify --print-certs "$FINAL_BASE" > "$FINAL_CERT_OUTPUT"
          FINAL_CERT=$(awk -F': ' \
            '/certificate SHA-256 digest:/ && !digest {digest=$NF} END {print digest}' \
            "$FINAL_CERT_OUTPUT" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          EXPECTED_HOST_CERT=$(printf '%s' "$EXPECTED_HOST_CERT" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          [ "$FINAL_CERT" = "$EXPECTED_HOST_CERT" ]

          LSPATCH_CONFIG=$(unzip -p "$FINAL_BASE" assets/lspatch/config.json)
          jq -e '.useManager == false and .sigBypassLevel == 2
            and .lspConfig.API_CODE == 102
            and .lspConfig.VERSION_CODE == 487
            and .lspConfig.VERSION_NAME == "1.2"' <<< "$LSPATCH_CONFIG" >/dev/null

          for split_name in "${SPLIT_NAMES[@]}"; do
            "$ZIPALIGN" -c -P 16 -v 4 "$WORK/bundle/$split_name" >/dev/null
          done
          BASE_ALIGNMENT="$WORK/base-alignment.txt"
          "$ZIPALIGN" -c -P 16 -v 4 "$FINAL_BASE" > "$BASE_ALIGNMENT" 2>&1 || true
          grep -Fq "assets/lspatch/so/${ARCHITECTURE}/liblspatch.so (OK)" "$BASE_ALIGNMENT"
          UNEXPECTED_BAD=$(grep 'BAD' "$BASE_ALIGNMENT" | grep -v 'assets/lspatch/so/' || true)
          test -z "$UNEXPECTED_BAD"

          OUT="$PWD/${DEFAULT_NAME}_${VERSION_NAME}_LSPatched_Ashfur${TARGET_SUFFIX}_${VARIANT}_${MODULE_SHA_SHORT}_${NONCE}.apks"
          (cd "$WORK/bundle" && zip -q -0 "$OUT" "${FINAL_ENTRIES[@]}" manifest.json)
          unzip -tq "$OUT" >/dev/null
          {
            echo "OUT=$OUT"
            echo "DEFAULT_NAME=$DEFAULT_NAME"
            echo "TARGET_SUFFIX=$TARGET_SUFFIX"
          } >> "$GITHUB_ENV"

      - name: Publish short-lived release
        env:
          GH_TOKEN: ${{ github.token }}
          REGION: ${{ inputs.region }}
          VARIANT: ${{ inputs.variant }}
          NONCE: ${{ inputs.nonce }}
        run: |
          set -euo pipefail
          TAG="lspatch-${NONCE}"
          gh release create "$TAG" "$OUT#$(basename "$OUT")" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Another Eden ${VERSION_NAME} ${REGION} ${RUNTIME_TARGET}" \
            --notes "Temporary ${SOURCE_KIND} LSPatch build for ${PACKAGE_NAME}. Target ${RUNTIME_TARGET}, guest ABI ${ARCHITECTURE}. Module ${MODULE_SHA_SHORT}. Automatically removed by the lspatch janitor."
